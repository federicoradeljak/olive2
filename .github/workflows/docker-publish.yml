name: Build and Publish Docker Image

on:
  push:
    # CalVer release tags (YYYY.MM.DD, optional .N same-day counter, no prefix).
    # Pushing one runs CI (ci.yml), publishes the image tagged with the CalVer
    # tag + :latest, and creates the GitHub release. Strict format validation
    # happens in the validate job — non-CalVer 4-digit tags fail fast there.
    tags: ["[0-9][0-9][0-9][0-9].*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to 'latest')"
        required: false
        default: "latest"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.resolve.outputs.build_tag }}
    steps:
      - name: Resolve and validate build tag
        id: resolve
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if ! [[ "${TAG}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
              echo "::error::Tag '${TAG}' is not CalVer — expected YYYY.MM.DD with an optional .N same-day counter (e.g. 2026.10.15 or 2026.10.15.1, no 'v' prefix). Delete the tag and push a corrected one."
              exit 1
            fi
            echo "Release build for CalVer tag ${TAG}"
            echo "build_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          else
            INPUT="${{ inputs.tag || 'latest' }}"
            if [[ "${INPUT}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
              echo "Manual build for CalVer tag ${INPUT}"
              echo "build_tag=${INPUT}" >> "${GITHUB_OUTPUT}"
            else
              echo "Manual build for non-release tag '${INPUT}' (no build tag baked in)"
              echo "build_tag=" >> "${GITHUB_OUTPUT}"
            fi
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve build identity (release tag + commit hash + UTC date for in-app display)
        run: |
          echo "OLIVE_BUILD_TAG=${{ needs.validate.outputs.build_tag }}" >> "${GITHUB_ENV}"
          echo "OLIVE_BUILD_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "OLIVE_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OLIVE_BUILD_TAG=${{ env.OLIVE_BUILD_TAG }}
            OLIVE_BUILD_SHA=${{ env.OLIVE_BUILD_SHA }}
            OLIVE_BUILD_DATE=${{ env.OLIVE_BUILD_DATE }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: merge
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history for changelog diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve previous CalVer tag
        id: prev
        run: |
          TAG="${GITHUB_REF_NAME}"
          mapfile -t CALVER_TAGS < <(git tag --list | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' || true)
          if [ "${#CALVER_TAGS[@]}" -gt 0 ]; then
            # TAG is included in the sort so the lookup is the predecessor by
            # version order (deduped, so identical when the tag already exists).
            PREV=$(printf '%s\n' "${CALVER_TAGS[@]}" "${TAG}" | sort -V -u | awk -v tag="${TAG}" '{ if ($0 == tag) { print prev; exit } prev = $0 }')
          else
            PREV=""
          fi
          echo "Current tag: ${TAG}, previous CalVer tag: '${PREV:-<none — first release>}'"
          echo "prev_tag=${PREV}" >> "${GITHUB_OUTPUT}"

      - name: Build release notes from CHANGELOG.md
        run: |
          ARGS=(--tag "${GITHUB_REF_NAME}" --image "${REGISTRY}/${IMAGE_NAME}" --output RELEASE_NOTES.md)
          if [ -n "${{ steps.prev.outputs.prev_tag }}" ]; then
            ARGS+=(--prev-tag "${{ steps.prev.outputs.prev_tag }}")
          fi
          python3 scripts/release_notes.py "${ARGS[@]}"
          echo "--- RELEASE_NOTES.md ---"
          cat RELEASE_NOTES.md

      - name: Create GitHub release (no artifacts — points at the GHCR image)
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          make_latest: "true"
