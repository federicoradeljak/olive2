name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Set up Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint and typecheck backend
        working-directory: backend
        run: |
          uv run ruff check src tests
          uv run basedpyright

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI TypeScript schema sync & build frontend
        working-directory: frontend
        run: |
          pnpm run generate:api
          git diff --exit-code src/api/schema.d.ts
          pnpm run typecheck
          pnpm run build
